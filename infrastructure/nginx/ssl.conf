###############################################################################
# infrastructure/nginx/ssl.conf — SSL/TLS configuration template
#
# Included by nginx.conf inside the HTTPS server block.
#
# USAGE:
#   Option A — Let's Encrypt (certbot):
#     1. Run: certbot certonly --webroot -w /var/www/certbot -d your.domain.com
#     2. Update the cert/key paths below.
#     3. Set up a cron job: certbot renew --quiet
#
#   Option B — Self-signed (development only):
#     openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#       -keyout infrastructure/nginx/certs/server.key \
#       -out  infrastructure/nginx/certs/server.crt \
#       -subj "/CN=localhost"
#
#   Option C — Bring your own certificate:
#     Place cert and key at the paths below.
#
# TLS SECURITY RATING TARGET: A+ on SSL Labs
###############################################################################

# ── Certificate and private key ───────────────────────────────────────────────
ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;

# ── Protocol versions ─────────────────────────────────────────────────────────
# Disable TLS 1.0 and 1.1 (deprecated, known weaknesses).
ssl_protocols TLSv1.2 TLSv1.3;

# ── Cipher suites ─────────────────────────────────────────────────────────────
# TLS 1.3 ciphers are negotiated automatically by OpenSSL.
# For TLS 1.2 we allow only ECDHE/DHE key exchange for forward secrecy.
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:'
            'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:'
            'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:'
            'DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA256';

# Server chooses the cipher from the list above (not the client's preference).
ssl_prefer_server_ciphers on;

# ── Diffie-Hellman parameters ─────────────────────────────────────────────────
# Generate once: openssl dhparam -out /etc/nginx/certs/dhparam.pem 2048
# Using 2048-bit is fine for most deployments; 4096-bit increases CPU cost.
ssl_dhparam /etc/nginx/certs/dhparam.pem;

# ── Elliptic curves ───────────────────────────────────────────────────────────
ssl_ecdh_curve prime256v1:secp384r1;

# ── Session caching ───────────────────────────────────────────────────────────
# Shared cache across workers — resumption avoids full handshake.
ssl_session_cache   shared:SSL:50m;
ssl_session_timeout 1d;               # reuse sessions for 1 day
ssl_session_tickets off;              # disable for perfect forward secrecy

# ── OCSP stapling ─────────────────────────────────────────────────────────────
# Allows the server to send a cached certificate-validity proof inline,
# saving the client a round-trip to the CA.
ssl_stapling        on;
ssl_stapling_verify on;

# Trust chain for OCSP (Let's Encrypt chain file, or your CA's chain).
ssl_trusted_certificate /etc/nginx/certs/chain.pem;

# Resolver for OCSP requests — use Cloudflare or your cloud's DNS.
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# ── Buffer sizing ─────────────────────────────────────────────────────────────
# Prevents TLS record fragmentation while keeping memory usage reasonable.
ssl_buffer_size 8k;
