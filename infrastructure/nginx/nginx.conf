###############################################################################
# infrastructure/nginx/nginx.conf
# Nginx reverse proxy for the AI Digital Human Platform
#
# Architecture:
#   Client → Nginx (80/443) → backend:8000  (FastAPI, /api + /ws)
#                           → frontend:80   (React SPA, everything else)
#
# Key features:
#   - HTTP → HTTPS redirect
#   - WebSocket upgrade (sticky sessions not required — stateless API)
#   - Rate limiting (per IP, separate zone for uploads)
#   - Gzip compression for text payloads
#   - Client-side caching headers for static assets
#   - Security headers (HSTS, CSP, X-Frame-Options, etc.)
#   - Large upload support (2 GB) with extended timeouts for video generation
#   - Real-IP resolution behind load balancers
###############################################################################

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
user  nginx;
worker_processes  auto;          # one worker per CPU core
worker_rlimit_nofile 65535;      # raise ulimit to handle many connections

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    # ── MIME types ────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';

    log_format  json  '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
                      '"method":"$request_method","uri":"$request_uri",'
                      '"status":$status,"bytes":$body_bytes_sent,'
                      '"referrer":"$http_referer","agent":"$http_user_agent",'
                      '"request_time":$request_time}';

    access_log  /var/log/nginx/access.log json;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  75s;
    keepalive_requests 1000;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_buffers     16 8k;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Upload / body size ────────────────────────────────────────────────────
    # 2 GB — required for large video and audio uploads.
    client_max_body_size  2048m;
    client_body_buffer_size  128k;
    client_body_timeout  300s;       # 5 min to receive the full body

    # ── Proxy defaults ────────────────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    X-Request-ID      $request_id;

    # Timeouts for long-running video generation requests (up to 15 minutes).
    proxy_connect_timeout  60s;
    proxy_send_timeout     900s;
    proxy_read_timeout     900s;

    proxy_buffering     on;
    proxy_buffer_size   16k;
    proxy_buffers       8 16k;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Zone for general API requests (10 MB state ≈ 160 K sessions).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # Stricter zone for auth endpoints to mitigate brute-force.
    limit_req_zone $binary_remote_addr zone=auth_limit:5m  rate=10r/m;

    # Separate zone for uploads — each upload is large, allow fewer concurrent.
    limit_req_zone $binary_remote_addr zone=upload_limit:5m rate=20r/m;

    limit_req_status  429;

    # ── Real-IP (if behind AWS ALB / Cloudflare) ──────────────────────────────
    # Uncomment and adjust for your load-balancer CIDR blocks.
    # set_real_ip_from  10.0.0.0/8;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;                # connection pool to FastAPI
    }

    upstream frontend {
        server frontend:80;
        keepalive 16;
    }

    # ── Security headers map ──────────────────────────────────────────────────
    # Applied in the server blocks below via add_header directives.

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Allow Certbot ACME challenge through before redirecting.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL config is in a separate file for maintainability.
        include /etc/nginx/ssl.conf;

        # ── Security headers ────────────────────────────────────────────────
        # HSTS: enforce HTTPS for 1 year, include subdomains.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Prevent click-jacking.
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Block MIME sniffing.
        add_header X-Content-Type-Options "nosniff" always;

        # XSS protection (legacy browsers).
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer policy.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions policy — restrict sensitive browser APIs.
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        # Content Security Policy — adjust allowed sources for your CDN / fonts.
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; "
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
            "font-src 'self' https://fonts.gstatic.com; "
            "img-src 'self' data: blob: https:; "
            "media-src 'self' blob: https:; "
            "connect-src 'self' wss: ws: https:; "
            "frame-ancestors 'none';"
            always;

        # ── Request ID ────────────────────────────────────────────────────────
        # Propagate a unique request trace ID (generated or passed through).
        add_header X-Request-ID $request_id always;

        # ── Authentication endpoints (strict rate limit) ──────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend;
        }

        # ── Upload endpoints (relaxed rate, extended timeouts) ────────────────
        location ~ ^/api/v1/(avatars|videos|voices|documents)/upload {
            limit_req zone=upload_limit burst=3 nodelay;

            # Extended timeouts for multi-GB uploads.
            proxy_read_timeout    1800s;   # 30 min
            proxy_send_timeout    1800s;
            proxy_connect_timeout  60s;

            proxy_pass http://backend;
        }

        # ── General API proxy ─────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend;
        }

        # ── WebSocket proxy ───────────────────────────────────────────────────
        # FastAPI WebSocket endpoints live under /ws/.
        location /ws/ {
            # HTTP Upgrade negotiation.
            proxy_set_header  Upgrade    $http_upgrade;
            proxy_set_header  Connection "upgrade";
            proxy_set_header  Host       $host;

            # Long timeout — WebSocket connections for streaming may last hours.
            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
            proxy_connect_timeout    60s;

            # Disable buffering for real-time streaming.
            proxy_buffering off;

            proxy_pass http://backend;
        }

        # ── Prometheus metrics (restrict to internal network) ─────────────────
        location /metrics {
            # Only allow internal monitoring scrapers.
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://backend;
        }

        # ── Health / readiness probes (no rate limit for k8s probes) ─────────
        location /health {
            proxy_pass http://backend;
            access_log off;
        }

        location /ready {
            proxy_pass http://backend;
            access_log off;
        }

        # ── Static asset caching ───────────────────────────────────────────────
        # Frontend assets with content-hash in filename can be cached forever.
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
            proxy_pass http://frontend;
            expires    1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
        }

        # ── Frontend SPA ───────────────────────────────────────────────────────
        # All other requests go to the React SPA. The frontend container's
        # inner nginx config handles the try_files → index.html fallback.
        location / {
            proxy_pass http://frontend;
            # Don't cache the HTML shell — it changes on each deploy.
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma no-cache;
            add_header Expires 0;
        }

        # ── Error pages ────────────────────────────────────────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
